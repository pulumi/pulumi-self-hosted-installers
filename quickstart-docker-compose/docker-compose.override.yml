# This is the DEV version.
# It runs images built from a local pulumi-service checkout instead of the
# published images. pulumi-service builds them with Bazel, so load them into
# the local docker daemon first, from the pulumi-service checkout:
#
#   ./tools/bazel run //tools/docker:load_service_linux_${ARCH}
#   ./tools/bazel run //tools/docker:load_console_linux_${ARCH}
#
# where ARCH is arm64 (Apple silicon, the default here) or amd64. For amd64,
# also export PULUMI_DEV_IMAGE_ARCH=amd64 before running docker compose.

networks:
  pulumi-self-hosted-installers:
    # Setting external to true will prevent docker-compose from creating the
    # network if it doesn't exist already.
    external: true

  # The pulumi-services network is used to put all the Pulumi services (i.e. api and console)
  # in the same network to enable communication between them using their container names.
  pulumi-services:

services:

  api:
    ports:
      - "8080:8080"
      - "8443:8443"
    image: "pulumi-local/service:linux-${PULUMI_DEV_IMAGE_ARCH:-arm64}"
    environment:
      API_TLS_CERTIFICATE: "${API_TLS_CERTIFICATE}"
      API_TLS_PRIVATE_KEY: "${API_TLS_PRIVATE_KEY}"
      API_MIN_TLS_VERSION: "1.2"
      PULUMI_API_DOMAIN: "localhost:8443"
      PULUMI_CONSOLE_DOMAIN: "localhost:3443"
    healthcheck:
      test: ["CMD", "/go/bin/http_health", "-f", "https://localhost:8443/api/status"]
  console:
    ports:
      - "3000:3000"
      - "3443:3443"
    image: "pulumi-local/console:linux-${PULUMI_DEV_IMAGE_ARCH:-arm64}"
    environment:
      PULUMI_API: "https://localhost:8443"
      PULUMI_API_INTERNAL_ENDPOINT: "https://pulumi-api:8443"
      PULUMI_CONSOLE_DOMAIN: "localhost:3443"
      PULUMI_HOMEPAGE_DOMAIN: "localhost:3443"
      CONSOLE_TLS_CERTIFICATE: "${CONSOLE_TLS_CERTIFICATE}"
      CONSOLE_TLS_PRIVATE_KEY: "${CONSOLE_TLS_PRIVATE_KEY}"
      ALLOW_INVALID_CERTS: "true"
