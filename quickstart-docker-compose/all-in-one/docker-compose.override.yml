# This is the DEV version of the all-in-one compose file.
# It runs images built from a local pulumi-service checkout instead of the
# published images. pulumi-service builds them with Bazel, so load them into
# the local docker daemon first, from the pulumi-service checkout:
#
#   ./tools/bazel run //tools/docker:load_service_linux_${ARCH}
#   ./tools/bazel run //tools/docker:load_console_linux_${ARCH}
#   ./tools/bazel run //tools/docker:load_migrations_linux_${ARCH}
#
# where ARCH is arm64 (Apple silicon, the default here) or amd64. For amd64,
# also export PULUMI_DEV_IMAGE_ARCH=amd64 before running docker compose.

networks:
  pulumi-self-hosted-installers:
    # Setting external to true will prevent docker-compose from creating the
    # network if it doesn't exist already.
    external: true

  pulumi-services:

services:

  api:
    ports:
      - "8080:8080"
    image: "pulumi-local/service:linux-${PULUMI_DEV_IMAGE_ARCH:-arm64}"
    pull_policy: never

  console:
    ports:
      - "3000:3000"
    image: "pulumi-local/console:linux-${PULUMI_DEV_IMAGE_ARCH:-arm64}"
    pull_policy: never

  migration:
    image: "pulumi-local/migrations:linux-${PULUMI_DEV_IMAGE_ARCH:-arm64}"
    pull_policy: never
