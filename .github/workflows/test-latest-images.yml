permissions: write-all # Equivalent to default permissions plus id-token: write
env:
  ESC_ACTION_OIDC_AUTH: true
  ESC_ACTION_OIDC_ORGANIZATION: pulumi
  ESC_ACTION_OIDC_REQUESTED_TOKEN_TYPE: urn:pulumi:token-type:access_token:organization
  ESC_ACTION_ENVIRONMENT: github-secrets/pulumi-pulumi-self-hosted-installers
  ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: false
# workflow_dispatch allows for manual triggering from the GitHub Actions UI, as well
# as the API. repository_dispatch allows us to trigger multiple workflows that
# match on an event_type parameter when triggered via an API call.
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows
on:
  pull_request: null
  workflow_dispatch: null
  schedule:
    # Daily certification that the published latest images pass the
    # integration tests (feeds the README badge).
    - cron: '17 9 * * *'
  repository_dispatch:
    types: [integration_tests]

name: Test latest images

jobs:
  s3-test:

    runs-on: ubuntu-latest
    env:
      # The service stores checkpoints and policy packs in a local
      # S3-compatible storage container (currently SeaweedFS). These fake keys
      # are the storage server's admin credentials and also the AWS credentials
      # the service and the AWS CLI use to reach it. Nothing in this job talks
      # to AWS.
      AWS_REGION: "us-west-2"
      AWS_ACCESS_KEY_ID: "s3-access-key"
      AWS_SECRET_ACCESS_KEY: "s3-secret-key"
      PULUMI_CHECKPOINT_BLOB_STORAGE_ENDPOINT: "s3://pulumi-checkpoints?endpoint=object-storage:8333&disableSSL=true&s3ForcePathStyle=true"
      PULUMI_POLICY_PACK_BLOB_STORAGE_ENDPOINT: "s3://pulumi-policy-packs?endpoint=object-storage:8333&disableSSL=true&s3ForcePathStyle=true"
      # renovate: datasource=docker depName=chrislusf/seaweedfs
      S3_STORAGE_IMAGE: "docker.io/chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882"
      ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: PULUMI_LICENSE_KEY

    steps:
      - name: Fetch secrets from ESC
        id: esc-secrets
        uses: pulumi/esc-action@32dda43ffe7a2ab21e6bce11c781b44a3e5623cf # v3

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6
        with:
          go-version: '1.26'

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: '24'

      - name: Checkout pulumi/pulumi-self-hosted-installers
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Login to Docker Hub as pulumi-bot
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ steps.esc-secrets.outputs.DOCKERHUB_USERNAME }}
          password: ${{ steps.esc-secrets.outputs.DOCKERHUB_PASSWORD }}

      - name: Run S3-compatible storage
        run: |
          set -x  # Enable command tracing

          # `weed mini` runs a single-node SeaweedFS server with its S3 API on
          # port 8333, using the AWS_* env vars as its admin credentials.
          docker run -d --name object-storage \
              --publish 8333:8333 \
              --volume object-storage-data:/data \
              --env AWS_ACCESS_KEY_ID \
              --env AWS_SECRET_ACCESS_KEY \
              "${S3_STORAGE_IMAGE}" \
              mini -dir=/data

          # The AWS CLI ships with the runner image and works as a generic S3
          # client, so a successful authenticated call means the server is ready.
          for i in {1..30}; do
            if aws s3 ls --endpoint-url http://127.0.0.1:8333; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: S3 storage never became ready after 60 seconds"
              docker logs object-storage 2>&1
              exit 1
            fi
            sleep 2
          done

          # Let processes on the runner resolve the host used in the storage endpoints.
          echo "127.0.0.1 object-storage" | sudo tee -a /etc/hosts

      - name: Create S3 buckets
        run: |
          set -x  # Enable command tracing

          # Bucket names must match the endpoints in the job env.
          for bucket in pulumi-checkpoints pulumi-policy-packs; do
            aws s3 mb "s3://${bucket}" --endpoint-url http://127.0.0.1:8333 || {
              echo "ERROR: Failed to create bucket ${bucket}"
              docker logs object-storage 2>&1
              exit 1
            }
          done

          aws s3 ls --endpoint-url http://127.0.0.1:8333

      - name: Configure S3 storage network
        run: |
          # Connect the storage container to the pulumi-self-hosted-installers docker network.
          docker network create pulumi-self-hosted-installers
          docker network connect pulumi-self-hosted-installers object-storage

      - uses: ./.github/actions/run-self-hosted
        timeout-minutes: 5
        with:
          compose-args: '-f ./quickstart-docker-compose/all-in-one/docker-compose.yml'

      - name: Run integration tests
        run: go test ./quickstart-docker-compose/tests/... -v --tags=s3

      - name: Upload service log as artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: ${{ always() }}
        with:
          name: service-log
          path: ${{ env.SERVICE_LOG }}
          overwrite: true
